# Shared reference configuration for preparation, SFT, BC, RL and evaluation.
# The stages select their own trainable modules; no FastWAM checkpoint is used.
model:
  model_type: lingbot_va_route_neutral
  precision: bf16
  is_lora: false  # The explicitly routed adapters are owned by the model itself.
  load_to_device: false
  device: cuda:0
  text_device: cpu
  seed: 42
  base_model_path: ${oc.env:LINGBOT_VA_BASE}
  parent_path: ${oc.env:LINGBOT_VA_PARENT,''}
  normalizer_path: ${oc.env:LINGBOT_VA_DATA}/normalizer.json
  bc_path: ${oc.env:LINGBOT_VA_BC,''}
  load_critic: false  # The online training entry enables this before construction.
  routing:
    height: 256
    width: 256
    camera_keys: [external, wrist]
    action_channels: [0, 1, 2, 3, 4, 5, 6, 28]
    frame_chunk_size: 4
    action_per_frame: 4
    execution_horizon: 8
    history_frames: 56
    action_hz: 20
    video_steps: 5
    action_steps: 10
    video_shift: 5.0
    action_shift: 1.0
    guidance_scale: 5.0
    action_guidance_scale: 1.0
    lora_rank: 16
    lora_alpha: 16.0
    gate_layers: [14, 15, 16, 17, 18, 19]
    gate_hidden: 256
    gate_queries: 4
    physical_history: 4
    state_dim: 15
    epsilon: 0.1
    temperature: 1.0
    flow_noise: 0.5
  critic:
    backbone:
      model_type: openpi
      model_path: ${oc.env:PI05_CRITIC_CHECKPOINT,''}
      precision: bf16
      is_lora: false
      strict_vlm_checkpoint: true
      num_action_chunks: 16
      action_dim: 8
      add_value_head: false
      openpi_data:
        norm_stats_path: ${oc.env:LINGBOT_VA_DATA}/critic_norm
      openpi:
        # Reuse this frozen prefix/image preprocessing, with NEW 15D state stats.
        config_name: pi05_libero
        num_images_in_input: 2
        train_expert_only: true
        add_value_head: false
        value_after_vlm: false
        value_vlm_mode: mean_token
        detach_critic_input: true
        action_chunk: 16
        action_env_dim: 8
        num_steps: 5
        noise_method: flow_sde
        noise_level: 0.5
offline:
  prepared: ${oc.env:LINGBOT_VA_DATA}
  steps: 2000
training:
  updates: 30
  episodes_per_update: 4
  warmup_updates: 5
  save_interval: 5
  minibatch_size: 8
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  gate_lr: 0.00003
  lora_lr: 0.00001
  critic_lr: 0.0001
  gate_entropy: 0.01
  flow_weight: 1.0
  bc_weight: 0.2
  value_weight: 0.5
  max_grad_norm: 1.0
runner:
  logger:
    log_path: null
    project_name: lingbot_va_single_arm
    experiment_name: seed42
    logger_backends: [tensorboard]
