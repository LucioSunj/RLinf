# @package _global_

routing_objective:
  type: upper_bound

runner:
  use_training_pipeline: false
  weight_sync_interval: 1
  fastwam_training_guard:
    enabled: true
    cost_audit:
      enabled: true
      break_even_guard_enabled: false
      counterfactual_idm_costs: [0.0, 0.0025, 0.005, 0.01, 0.015, 0.025, 0.05, 0.1]

algorithm:
  fixed_branch_cost:
    enabled: true
    idm_cost: 0.0
    uncond_cost: 0.0
    fair_cost:
      enabled: false
    controller:
      type: budget_dual
      profile: upper_bound_zero_init
      constraint: upper_bound
      rate:
        scope: eligible_gate_decisions
        feedback: expected_behavior_probability
        target_idm_fraction: 0.5
      charge_scope: eligible_nonforced_idm
      initializer:
        type: constant
        idm_cost: 0.0
      dual:
        # Canary defaults only; formal gains remain uncalibrated.
        learning_rate: 0.0025
        ema_beta: 0.0
        deadband: 0.02
        update_interval: 1
        min_idm_cost: 0.0
        max_idm_cost: 0.1
        max_delta_per_update: 0.005
      diagnostics:
        - type: fair_break_even
          enabled: true
          diagnostic_only: true
          window_size: 5
          bootstrap_value_for_display: 0.0
