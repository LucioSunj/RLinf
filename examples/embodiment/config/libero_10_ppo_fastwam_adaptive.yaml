defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/fastwam_adaptive@actor.model
  - model/fastwam_adaptive@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: rlinf
    experiment_name: libero_10_ppo_fastwam_adaptive
    logger_backends: [tensorboard]
  max_epochs: 1000
  max_steps: -1
  only_eval: false
  val_check_interval: -1
  save_interval: 40
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: true
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: fastwam_dual_ppo
  loss_agg_func: token-mean
  gamma: 0.99
  gae_lambda: 0.95
  gate_ppo:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coefficient: 0.0
    loss_weight: 1.0
  uncond_flow_ppo:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coefficient: 0.0
    loss_weight: 1.0
  critic_loss:
    value_clip: 0.2
    huber_delta: 10.0
    loss_weight: 1.0
    warmup_steps: 0
  regularization:
    base_uncond_kl:
      enabled: false
      coefficient: 0.0
      log_metric: true
    collapse:
      enabled: false
      coefficient: 0.0
      tau_calls: 1.0
      # PPO shuffles chunks before replay, so v0 uses a memory-microbatch surrogate.
      scope: microbatch
  fixed_branch_cost:
    enabled: true
    # Sweep with `algorithm.fixed_branch_cost.idm_cost=<value>`.
    idm_cost: 1.0
    uncond_cost: 0.0

env:
  group_name: EnvGroup
  train:
    # Stored all-layer K/V is intentionally the default. Start with one
    # environment for memory calibration before overriding this upward.
    rollout_epoch: 1
    total_num_envs: 1
    reward_coef: ${algorithm.reward_coef}
    use_step_penalty: false
  eval:
    rollout_epoch: 1
    total_num_envs: 100
    auto_reset: true
    ignore_terminations: true
    group_size: 1
    is_eval: true
    use_step_penalty: false

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  unnorm_key: libero_10
  enable_offload: false
  pipeline_stage_num: 1

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 8
  seed: 42
  enable_offload: false
  optim:
    lr: 1.0e-5
    gate_lr: 1.0e-4
    lora_lr: 1.0e-5
    value_lr: 1.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    weight_decay: 0.0
    clip_grad: 1.0
    critic_warmup_steps: 0
    total_training_steps: 1000
    min_lr_rate: 0.1
    lr_scheduler: cosine
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    save_full_model_weights: false
    # The composite module deliberately mixes frozen backbones with three
    # trainable parameter families.
    use_orig_params: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: false

critic:
  use_critic_model: false
