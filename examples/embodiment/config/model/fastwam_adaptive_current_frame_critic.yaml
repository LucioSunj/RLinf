defaults:
  - fastwam_adaptive
  - _self_

# Opt-in Gate-style critic over detached current-frame Video K/V and the
# prompt+state Context K/V. The default fastwam_adaptive preset remains Pi05.
critic:
  kind: fastwam_current_frame_value
  load_for_eval: false
  backbone_checkpoint_sha256: null
  backbone: null
  input_dim: 256
  hidden_sizes: []
  activation: relu
  bias_last: true
  feature:
    source_dim: 3072
    layer_indices: [14]
    sources: [current_frame_video, text_state_context]
  transformer:
    hidden_dim: 256
    num_query_tokens: 4
    ffn_multiplier: 4
    share_blocks: false
    layer_index_embedding: true
    pooling: mean_token
