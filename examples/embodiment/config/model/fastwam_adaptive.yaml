model_type: fastwam_adaptive
precision: bf16
init_device: cpu

action_dim: 7
# RLinf's generic trajectory dimension is the number of primitive actions that
# actually reach LIBERO between replans. FastWAM still generates the 32-action
# sequence used by its parent training preset; runtime.execution_horizon selects
# the official first 10 actions without changing the generated sequence.
num_action_chunks: 10
actor_checkpoint: ${oc.env:FASTWAM_CHECKPOINT}
actor_checkpoint_sha256: ${oc.env:FASTWAM_CHECKPOINT_SHA256}
# Kept for RLinf's generic HuggingFace rollout bootstrap; the FastWAM builder
# still verifies and loads actor_checkpoint explicitly.
model_path: ${oc.env:FASTWAM_CHECKPOINT}
is_lora: false
add_value_head: true

fastwam:
  _target_: fastwam.runtime.create_fastwam_idm
  model_id: ${oc.env:FASTWAM_MODEL_ID,Wan-AI/Wan2.2-TI2V-5B}
  tokenizer_model_id: ${oc.env:FASTWAM_TOKENIZER_MODEL_ID,Wan-AI/Wan2.1-T2V-1.3B}
  tokenizer_max_len: 128
  load_text_encoder: true
  proprio_dim: 8
  redirect_common_files: true
  mot_checkpoint_mixed_attn: false
  action_dit_pretrained_path: null
  skip_dit_load_from_pretrain: true
  video_dit_config:
    has_image_input: false
    patch_size: [1, 2, 2]
    in_dim: 48
    hidden_dim: 3072
    ffn_dim: 14336
    freq_dim: 256
    text_dim: 4096
    out_dim: 48
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    eps: 1.0e-6
    seperated_timestep: true
    require_clip_embedding: false
    require_vae_embedding: false
    fuse_vae_embedding_in_latents: true
    use_gradient_checkpointing: false
    video_attention_mask_mode: first_frame_causal
    action_conditioned: false
    action_dim: ${...action_dim}
    action_group_causal_mask_mode: group_diagonal
  action_dit_config:
    action_dim: ${...action_dim}
    hidden_dim: 1024
    ffn_dim: 4096
    num_heads: 24
    attn_head_dim: 128
    num_layers: 30
    text_dim: 4096
    freq_dim: 256
    eps: 1.0e-6
    use_gradient_checkpointing: false
  video_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  action_scheduler:
    train_shift: 5.0
    infer_shift: 5.0
    num_train_timesteps: 1000
  loss:
    lambda_action: 1.0

uncond_lora:
  rank: 16
  alpha: 16.0
  dropout: 0.0
  target_groups:
    - self_attention_qkvo
    - cross_attention_qkvo
    - ffn
  freeze_base: true
  strict_target_discovery: true

# P6 is an opt-in capacity variant. The disabled v0 preset returns before
# constructing or loading DINO. Every null below must be explicitly pinned in
# an enabled experiment; there are intentionally no scientific defaults.
uncond_visual_sidecar:
  enabled: false
  type: dinov3_router_wan_value
  enabled_regimes: [uncond]
  dispatch_before_encoder: true
  dino:
    source_root: null
    source_revision: null
    model_name: null
    weights_path: null
    weights_sha256: null
    preprocess_sha256: null
    output_contract_sha256: null
    compute_dtype: null
    license_id: null
    camera_input_contract_sha256: null
    token_kind: x_norm_patchtokens
    per_camera: true
    frozen: true
    stop_gradient: true
  router:
    query_source: base_modulated_self_attn_input
    query_projection: null
    query_rank: null
    temperature: null
    score_dtype: float32
    per_camera_softmax: true
    camera_mass: fixed
    camera_mass_values: []
    invalid_camera_policy: renormalize_active_or_fail_closed
  transport:
    mode: deterministic_area_overlap
    contract_sha256: null
    preserve_row_mass: true
    fail_closed: true
  optimizer:
    family: visual_router
    lr: null
    weight_decay: null
    scheduler: null
    parameter_allowlist:
      - "routers.*.query_projection.*"
      - "branches.*.*.raw_beta"
    fail_on_empty_or_overlap: true
  wan_value:
    source: video_cache_current_prefix
    flatten_order: t_h_w_row_major
    output_projection: frozen_action_self_attn_o_weight_only
    output_bias: false
    reuse_base_gate_msa: true
    spatial_metadata:
      wan_grid_f: null
      wan_grid_h: null
      wan_grid_w: null
      current_frame_video_tokens: null
      wan_flatten_order: t_h_w_row_major
      vae_model_type: null
      vae_weights_sha256: null
      vae_spatial_downsample_factor: null
      video_dit_weights_sha256: null
      video_dit_patch_size: null
      video_attention_num_heads: null
      video_attention_head_dim: null
      video_value_layout: batch_sequence_flat_heads
      video_value_rope_applied: false
      camera_concat_mode: null
      camera_order: []
      per_camera_post_crop_hw: []
      per_camera_combined_rgb_box: []
      per_camera_wan_grid_support: []
      dino_patch_grid: null
      dino_preprocess_sha256: null
      invalid_mask_policy: renormalize_active_or_fail_closed
      query_source: base_modulated_self_attn_input
      query_timing: pre_block
      residual_timing: post_block
      spatial_transport_contract_sha256: null
  injection:
    query_timing: pre_block
    residual_timing: post_block
    layer_indices: []
    beta_parameterization: bounded_tanh
    beta_max: null
    zero_init: beta
    modify_base_attention: false
  replay:
    backend: null
    storage_dtype: bfloat16
    pin_memory: true
    max_bytes_per_sample: null
    max_aggregate_bytes: null

gate:
  hidden_dim: 256
  num_query_tokens: 4
  share_blocks: false
  ffn_multiplier: 4
  denoise_last_n: 1
  layer_taps:
    mode: all
    last_n: null
    indices: null
  current_mode_embedding: true
  layer_index_embedding: true
  denoise_timestep_embedding: true

gate_epsilon: 0.1
gate_temperature: 1.0
eval_routing_mode: learned_threshold
eval_idm_threshold: 0.5
eval_random_idm_probability: null
eval_routing_seed: 0
eval_microbatch_size: 1
eval_timing_cuda_synchronize: false

kv_replay:
  # Set to recompute only for the explicit memory ablation.
  backend: stored
  storage_dtype: bfloat16
  pin_memory: true
  deduplicate_static_banks: true
  # Fail closed if a shape/config change exceeds the measured all-layer budget.
  max_bytes_per_sample: 268435456

flow_sde:
  enabled: true
  joint_logprob: false
  denoise_index_sampling: uniform
  noise_level: 0.5
  # A final deterministic ODE step keeps the single stochastic transition
  # away from the action-submission boundary. Real P6b evidence showed that
  # selecting step 9/9 could push an otherwise valid UNCOND action past the
  # exact live LIBERO bounds.
  ignore_last_transition: true

runtime:
  _target_: rlinf.models.embodiment.wam_policy.libero_runtime.LiberoFastWAMRuntime
  processor:
    _target_: fastwam.datasets.lerobot.processors.fastwam_processor.FastWAMProcessor
    shape_meta:
      images:
        - {key: image, raw_shape: [3, 256, 256], shape: [3, 224, 224]}
        - {key: wrist_image, raw_shape: [3, 256, 256], shape: [3, 224, 224]}
      action:
        - {key: default, raw_shape: 7, shape: 7}
      state:
        - {key: default, raw_shape: 8, shape: 8}
    num_obs_steps: 33
    num_output_cameras: 2
    action_output_dim: 7
    proprio_output_dim: 8
    action_state_transforms: null
    use_stepwise_action_norm: false
    norm_default_mode: min/max
    norm_exception_mode: null
    action_state_merger:
      _target_: fastwam.datasets.lerobot.transforms.action_state_merger.ConcatLeftAlign
    train_transforms: null
    val_transforms: null
    drop_high_level_prob: 1.0
    use_zh_instruction: false
    tokenizer: null
    delta_action_dim_mask:
      default: [true, true, true, true, true, true, false]
  processor_stats_path: ${oc.env:FASTWAM_DATASET_STATS}
  generation_horizon: 32
  execution_horizon: ${..num_action_chunks}
  # Match the official evaluator's settle period and LIBERO-10 episode budget.
  reset_wait_steps: 30
  max_episode_steps: 700
  # (data.train.num_frames - 1) / action_video_freq_ratio + 1 = 9.
  num_video_frames: 9
  # Candidate checkpoint config.yaml sets eval_num_inference_steps=10.
  num_inference_steps: 10
  # Match the official evaluator's rand_device=cpu for explicit local seeds.
  seeded_noise_device: cpu
  sigma_shift: null
  camera_height: 224
  camera_width: 224
  camera_concat: horizontal
  # Byte-exact with FastWAM's official LIBERO evaluator.
  camera_resize_mode: official_pil_center_crop
  tiled_vae: false
  binarize_gripper: true
  prompt_template: "A video recorded from a robot's point of view executing the following instruction: {task}"
  text_embedding_cache_dir: null
  text_embedding_context_len: 128

critic:
  kind: pi0_5_value_after_vlm
  # Standalone evaluation loads only Gate + LoRA unless explicitly overridden.
  load_for_eval: false
  backbone_checkpoint_sha256: ${oc.env:PI05_CRITIC_CHECKPOINT_SHA256,''}
  input_dim: 2048
  hidden_sizes: [1024, 512, 256]
  backbone:
    model_type: openpi
    model_path: ${oc.env:PI05_CRITIC_CHECKPOINT,''}
    precision: null
    num_action_chunks: 10
    action_dim: 7
    is_lora: false
    strict_vlm_checkpoint: true
    lora_rank: 32
    use_proprio: true
    num_steps: 5
    # Must remain false: the composite wrapper creates a fresh head after load.
    add_value_head: false
    openpi:
      config_name: pi05_libero
      num_images_in_input: 2
      noise_level: 0.5
      action_chunk: ${..num_action_chunks}
      num_steps: ${..num_steps}
      train_expert_only: true
      action_env_dim: ${..action_dim}
      noise_method: flow_sde
      add_value_head: false
      value_after_vlm: false
      value_vlm_mode: mean_token
      detach_critic_input: true
