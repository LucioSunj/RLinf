defaults:
  # These are the same component defaults used by the original n=15
  # online-IDM-BC cost-0.0175 run.  The original top-level preset cannot be a
  # Hydra child because it owns hydra.searchpath, so its scientific fields are
  # expanded explicitly below.
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/fastwam_adaptive@actor.model
  - model/fastwam_adaptive@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - online_idm_bc: enabled
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor: "0-0"
    env: "1-7"
    rollout: "1-7"

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: fastwam-adaptive
    experiment_name: original_cost0p0175_task0_seed11_8gpu_n84_20260828_v1
    logger_backends: [tensorboard, wandb]
    wandb_entity: luciojunsun-xi-an-jiaotong-liverpool-university
    fastwam_observability:
      enabled: true
      tensorboard:
        custom_scalars: true
        flush_every_step: true
        flush_secs: 10
      static_plots:
        enabled: true
        output_dir: null
        interval_steps: 5
        smoothing: 0.6
        dpi: 160
        export_all_scalars_on_finish: true
  max_epochs: 30
  max_steps: 30
  only_eval: false
  val_check_interval: -1
  save_interval: 10
  resume_dir: null
  ckpt_path: null
  overlap_env_bootstrap: false
  use_training_pipeline: null
  formal_execution_profile: null
  fastwam_n4_to_three_rollout_resume: false
  bootstrap_project_checkpoint_dir: null
  bootstrap_uncond_lora_sidecar: null
  bootstrap_uncond_lora_sidecar_sha256: null
  short_rl_canary_require_success_signal: false
  short_rl_canary_relative_movement_lr_step_multipliers:
    gate: 10.0
    lora: 40.0
    value_head: 1.0
  fastwam_gate_gradient_diagnostic:
    enabled: false
    sample_sizes: [250, 500, 1000, 2000]
    repeats: 5
    seed: 0
  fastwam_training_guard:
    enabled: true
    action_contract_violation_outcome: fail_episode
    gate_parameter_audit_interval_updates: 10
    zero_success_patience: 3
    break_even_patience: 3
    window_size: 3
    eligible_idm_fraction_min: 0.05
    eligible_idm_fraction_max: 0.95
    gate_entropy_min: 0.1
    gate_kl_median_max: 0.05
    gate_kl_single_max: 0.1
    gate_clip_median_max: 0.6
    gate_clip_single_max: 0.8
    cost_audit:
      enabled: true
      counterfactual_idm_costs: [0.0, 0.0025, 0.005, 0.01, 0.015, 0.0175, 0.02, 0.025, 0.0375, 0.05, 0.1]

algorithm:
  normalize_advantages: true
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: fastwam_dual_ppo
  loss_agg_func: token-mean
  gamma: 0.99
  gae_lambda: 0.95
  gate_ppo:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coefficient: 0.01
    loss_weight: 1.0
  uncond_flow_ppo:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coefficient: 0.0
    loss_weight: 1.0
  critic_loss:
    value_clip: 0.2
    huber_delta: 10.0
    loss_weight: 1.0
    warmup_steps: 0
  regularization:
    base_uncond_kl:
      enabled: false
      coefficient: 0.0
      log_metric: true
    collapse:
      enabled: false
      coefficient: 0.0
      tau_calls: 1.0
      scope: microbatch
  fixed_branch_cost:
    enabled: true
    idm_cost: 0.0175
    uncond_cost: 0.0

env:
  group_name: EnvGroup
  train:
    task_id_filter: [0]
    total_num_envs: 28
    rollout_epoch: 3
    group_size: 1
    seed: 11
    auto_reset: false
    ignore_terminations: false
    max_steps_per_rollout_epoch: 700
    max_episode_steps: 700
    reset_wait_steps: 30
    video_cfg:
      save_video: false
      info_on_video: false
    reward_coef: ${algorithm.reward_coef}
    use_step_penalty: false
  eval:
    rollout_epoch: 1
    total_num_envs: 100
    reward_coef: ${algorithm.reward_coef}
    auto_reset: true
    ignore_terminations: true
    group_size: 1
    is_eval: true
    use_step_penalty: false

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 588
  seed: 11
  enable_offload: false
  optim:
    lr: 1.0e-5
    gate_lr: 3.0e-5
    lora_lr: 1.0e-5
    value_lr: 1.0e-4
    critic_warmup_steps: 0
    total_training_steps: 3000
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    update_resolution_min_half_ulp_ratio: 1.0
    weight_decay: 0.0
    clip_grad: 1.0
    min_lr_rate: 0.1
    lr_scheduler: cosine
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    save_full_model_weights: false
    use_orig_params: true
    ignore_frozen_parameters: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: ${actor.model.precision}
      cast_root_forward_inputs: false
  model:
    gate_epsilon: 0.1
    gate_temperature: 1.0
    gate:
      layer_taps:
        mode: indices
        last_n: null
        indices: [14, 15, 16, 17, 18, 19]
    uncond_lora:
      rank: 32
      alpha: 16.0
      dropout: 0.0
    fastwam:
      load_text_encoder: false
    runtime:
      text_embedding_cache_dir: /data0/FastWAM-PERF-002-storage/root-migration-20260716T0311Z/repo-runs-performance-assets/text_embeds_cache/libero
    flow_sde:
      ignore_last_transition: true
    kv_replay:
      backend: stored
      storage_dtype: bfloat16
      gate_kv_sample_budget: null
      max_bytes_per_sample: 268435456
      hot_capacity_bytes_per_rollout_rank: 13421772800
      cold_capacity_bytes_per_rollout_rank: 8589934592
      nvme_capacity_bytes_per_rollout_rank: 4294967296
      nvme_path: /data0/fastwam_kv/original_cost0p0175_task0_seed11_8gpu_n84_20260828_v1
      hot_min_free_bytes: 4294967296
      prefetch_depth: 3
      transport: host_staging

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  unnorm_key: libero_10
  pipeline_stage_num: 1
  recompute_logprobs: false
  enable_offload: false
  model:
    gate_epsilon: 0.1
    gate_temperature: 1.0
    gate:
      layer_taps:
        mode: indices
        last_n: null
        indices: [14, 15, 16, 17, 18, 19]
    uncond_lora:
      rank: 32
      alpha: 16.0
      dropout: 0.0
    fastwam:
      load_text_encoder: false
    runtime:
      text_embedding_cache_dir: /data0/FastWAM-PERF-002-storage/root-migration-20260716T0311Z/repo-runs-performance-assets/text_embeds_cache/libero
    flow_sde:
      ignore_last_transition: true
    kv_replay:
      backend: stored
      storage_dtype: bfloat16
      gate_kv_sample_budget: null
      max_bytes_per_sample: 268435456
      hot_capacity_bytes_per_rollout_rank: 13421772800
      cold_capacity_bytes_per_rollout_rank: 8589934592
      nvme_capacity_bytes_per_rollout_rank: 4294967296
      nvme_path: /data0/fastwam_kv/original_cost0p0175_task0_seed11_8gpu_n84_20260828_v1
      hot_min_free_bytes: 4294967296
      prefetch_depth: 3
      transport: host_staging

weight_syncer:
  patch:
    transport_device: cpu

reward:
  use_reward_model: false

critic:
  use_critic_model: false
