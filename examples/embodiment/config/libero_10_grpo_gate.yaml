# Binary UNCOND/IDM gate on a frozen dual-regime FastWAM, trained on LIBERO-10.
# (PPO variant: see TODO at the bottom — switch adv_type/loss_type + add_value_head.)
#
# Cloned from libero_10_grpo_openpi.yaml; the VLA actor/rollout model is replaced
# by `gate_policy` (a tiny binary categorical on the frozen WAM). Paths marked
# /path/to/... and ${oc.env:...} must be set for your machine.
defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    # Start collocated. If the frozen WAM and the sim contend for GPU, switch to a
    # disaggregated layout (env / rollout / actor on separate ranks).
    actor,env,rollout: all

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "libero_10_grpo_gate"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 40        # per-eval logs success + mean-cost + mode-usage
  save_interval: 40
  resume_dir: null
  ckpt_path: null                # M3: set to the train_gate_bc.py output for BC warm-start

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8                 # GRPO: G mode-sequences per fixed reset init
  reward_coef: 1.0
  reward_type: chunk_level      # one gate decision per chunk-step
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo                # TODO(PPO): set `gae` + loss_type actor_critic + add_value_head
  loss_type: actor             #   and a value head over world_feat (see actor.model).
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.01           # collapse-prevention: keep mode distribution non-degenerate
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  gamma: 0.99
  gae_lambda: 0.95

# Gate-specific multi-component reward (rlinf.models.embodiment.gate_policy.reward).
# Combined at the reward-stream assembly hook (see adaptive_gate README §wiring).
gate_reward:
  w_success: 1.0
  lambda_cost: 0.05             # maximum all-IDM episode compute penalty
  lambda_warmup_steps: 200      # anneal lambda 0 -> lambda_cost (learn to act, then economize)
  lambda_start: 0.0

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 8
    total_num_envs: 64
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True   # same init within a GRPO group (group baseline)
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
  eval:
    rollout_epoch: 1
    # Periodic distributed validation subset (divisible by 1/2/4/8 ranks).
    # Run the exact 500-trial benchmark separately on a compatible rank count.
    total_num_envs: 496
    auto_reset: True
    ignore_terminations: True
    # Match FastWAM's official LIBERO-10 evaluation horizon.
    max_episode_steps: 700
    max_steps_per_rollout_epoch: 700
    group_size: 1
    is_eval: True

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: libero_10
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: gate_policy
    precision: ${actor.model.precision}
    model_path: ${actor.model.model_path}
    is_lora: False
    load_wam: True
    world_feat_dim: ${actor.model.world_feat_dim}
    text_feat_dim: ${actor.model.text_feat_dim}
    action_dim: ${actor.model.action_dim}
    num_action_chunks: ${actor.model.num_action_chunks}
    add_value_head: ${actor.model.add_value_head}
    proprio_dim: ${actor.model.proprio_dim}
    gate: ${actor.model.gate}
    wam: ${actor.model.wam}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  # 480/exec_horizon(10) * rollout_epoch(8) * envs(64) = 24576,
  # exactly 12 global batches per rollout.
  global_batch_size: 2048
  seed: 42
  enable_offload: False

  model:
    model_type: gate_policy
    precision: "fp32"            # keep categorical logits/logprobs numerically stable
    model_path: ""
    is_lora: False
    load_wam: False              # actor only recomputes gate logprobs; rollout owns frozen WAM
    world_feat_dim: 240          # spatially pooled 2x2 VAE grid + global statistics
    text_feat_dim: 64            # deterministic pooled instruction context
    # discrete mode is the policy-gradient action (one per chunk-step)
    action_dim: 1
    num_action_chunks: 1
    add_value_head: False        # GRPO is critic-free; True only for the PPO variant
    proprio_dim: 8               # LIBERO states dim
    gate:
      num_modes: 2               # categorical order: UNCOND=0, IDM=1
      hidden_sizes: [256, 256]
      activation: tanh
      force_mode: null            # eval-only smoke: 0=UNCOND, 1=IDM
      allow_legacy_gate_checkpoint: False  # fail closed when .meta.json is missing
      # Label-free collapse prevention (with entropy_bonus + lambda warmup this is
      # the DEFAULT, zero-supervision training path): w.p. eps sample a uniform
      # random mode in TRAIN rollouts. This mixture is the optimized policy and
      # its per-sample epsilon is replayed, so the pre-update ratio is exactly 1.
      # Anneal via GatePolicy.set_explore_eps
      # (runner hook) or keep a small constant.
      explore_eps: 0.10
      # OPTIONAL BC warm-start (self-generated oracle labels; NO human annotation,
      # but still a supervised objective — leave off for the pure-RL gate).
      # bc_init_path loads the weights in get_model (covers rollout + eval-only);
      # runner.ckpt_path loads them into the actor. Set BOTH to the same file.
      bc_init_path: null
      kl_prior:
        enabled: False           # differentiable actor-side KL(pi || pi_BC)
        path: null               # defaults to bc_init_path
        beta: 0.0                # e.g. 0.05 with a BC warm-start
        beta_end: 0.0
        decay_steps: 200
    # frozen fast-wam dual-regime backbone (build/freeze in get_model)
    wam:
      configs_dir: ${oc.env:FASTWAM_CONFIGS}      # path to FastWAM/configs
      suite: libero
      task: libero_dual_regime_fused_2cam224_1e-4
      backbone_kind: idm
      ckpt: /path/to/dual_regime_idm_checkpoint.pt
      dataset_stats_path: /path/to/libero_dataset_stats.json
      require_dataset_stats: True
      allow_online_text_encoding: False
      action_dim: 7
      num_video_frames: 9
      context_len: 128
      generation_horizon: 32      # WAM output length
      exec_horizon: 10            # environment prefix; one gate decision per 10 steps
      inference_steps: 20         # complete solver for both UNCOND and IDM branches
      default_seed: 0             # deterministic frozen-WAM conditional policy
      cost_table_path: /path/to/FastWAM/configs/adaptive_gate/wam_cost_libero_idm.yaml
      device: cuda
      dtype: bfloat16

  optim:
    lr: 3.0e-4                    # gate is tiny; can use a larger lr than a VLA
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
