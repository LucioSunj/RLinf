# Adaptive-prediction GATE on a FROZEN fast-wam, trained with GRPO on RoboTwin.
# Mirrors libero_10_grpo_gate.yaml; RoboTwin specifics marked. Swap the env default
# (env/robotwin_*) for other RoboTwin tasks. Paths marked /path/to & ${oc.env:...}.
# (PPO variant: see TODO — switch adv_type/loss_type + add_value_head.)
defaults:
  - env/robotwin_beat_block_hammer@env.train
  - env/robotwin_beat_block_hammer@env.eval
  - training_backend/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: all      # disaggregate (env/rollout/actor) if GPU-contended

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_grpo_gate"
    logger_backends: ["tensorboard"]
  max_epochs: 1000
  max_steps: -1
  only_eval: False
  val_check_interval: 40
  save_interval: 40
  resume_dir: null
  ckpt_path: null

algorithm:
  normalize_advantages: True
  kl_penalty: kl
  group_size: 8
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 2
  adv_type: grpo                # TODO(PPO): gae + actor_critic + add_value_head
  loss_type: actor
  loss_agg_func: "token-mean"
  kl_beta: 0.0
  entropy_bonus: 0.01           # collapse-prevention
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  gamma: 0.99
  gae_lambda: 0.95

gate_reward:
  w_success: 1.0
  lambda_cost: 0.05
  lambda_warmup_steps: 200
  lambda_start: 0.0
  w_agreement: 0.0

env:
  group_name: "EnvGroup"
  train:
    rollout_epoch: 8
    total_num_envs: 64
    reward_coef: ${algorithm.reward_coef}
    group_size: ${algorithm.group_size}
    use_fixed_reset_state_ids: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
  eval:
    rollout_epoch: 1
    total_num_envs: 100
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 480
    max_steps_per_rollout_epoch: 480
    group_size: 1
    is_eval: True

rollout:
  group_name: "RolloutGroup"
  generation_backend: "huggingface"
  recompute_logprobs: False
  unnorm_key: robotwin          # TODO(verify): match the RoboTwin norm key
  enable_offload: False
  pipeline_stage_num: 1
  model:
    model_type: gate_policy
    precision: ${actor.model.precision}
    model_path: ${actor.model.model_path}
    load_wam: True

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 128
  global_batch_size: 2048
  seed: 42
  enable_offload: False

  model:
    model_type: gate_policy
    precision: "bf16"
    model_path: ""
    is_lora: False
    load_wam: False              # actor only recomputes gate logprobs; rollout owns frozen WAM
    world_feat_dim: 48           # Wan2.2 VAE latent channel dim used by WAMModeAdapter
    action_dim: 1
    num_action_chunks: 1
    add_value_head: False
    proprio_dim: 14              # RoboTwin states dim (TODO: verify against env)
    gate:
      num_modes: 3
      hidden_sizes: [256, 256]
      use_last_action: False
      activation: tanh
    wam:
      configs_dir: ${oc.env:FASTWAM_CONFIGS}
      suite: robotwin
      task: robotwin_metric_adaptive_joint_3cam_384_1e-4
      backbone_kind: joint
      ckpt: /path/to/dual_regime_joint_robotwin_checkpoint.pt
      dataset_stats_path: /path/to/robotwin_dataset_stats.json
      require_dataset_stats: True
      load_text_encoder: True
      world_feat_dim: ${actor.model.world_feat_dim}
      action_dim: 14
      num_video_frames: 9        # TODO(verify): RoboTwin video frames
      action_horizon: 32         # TODO(verify): RoboTwin action chunk length
      k_lo: 4
      k_hi: 20
      cost_table_path: /path/to/FastWAM/configs/adaptive_gate/wam_cost_robotwin_joint.yaml
      device: cuda
      dtype: bfloat16

  optim:
    lr: 3.0e-4
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0

  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard"
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False
