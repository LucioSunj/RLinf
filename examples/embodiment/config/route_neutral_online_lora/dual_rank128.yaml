# @package _global_
# Bootstrap both UNCOND branches from a complete dual BC sidecar.
actor:
  model:
    uncond_lora:
      rank: 128
      alpha: 128
      dropout: 0.0
    video_lora:
      rank: 128
      alpha: 128
      dropout: 0.0
      target_groups: [self_attention_qkvo, cross_attention_qkvo, ffn]

rollout:
  model:
    uncond_lora:
      rank: 128
      alpha: 128
      dropout: 0.0
    video_lora: ${actor.model.video_lora}
