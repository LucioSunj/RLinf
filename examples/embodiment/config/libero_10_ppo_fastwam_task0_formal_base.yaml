# Shared scientific contract for the three independent formal seeds.  Host
# geometry and bounded K/V tier capacities live in the three leaf configs.
cluster:
  num_nodes: 1

runner:
  task_type: embodied
  logger:
    log_path: ../results
    project_name: fastwam-adaptive
    experiment_name: formal_task0_base_not_for_launch
    logger_backends: [tensorboard]
    fastwam_observability:
      enabled: true
      tensorboard:
        custom_scalars: true
        flush_every_step: true
        flush_secs: 10
      static_plots:
        enabled: true
        output_dir: null
        interval_steps: 5
        smoothing: 0.6
        dpi: 160
        export_all_scalars_on_finish: true
  max_epochs: 30
  max_steps: 30
  only_eval: false
  val_check_interval: -1
  save_interval: 5
  resume_dir: null
  ckpt_path: null
  overlap_env_bootstrap: false
  use_training_pipeline: false
  formal_execution_profile: null
  fastwam_n4_to_three_rollout_resume: false
  short_rl_canary_require_success_signal: false
  short_rl_canary_relative_movement_lr_step_multipliers:
    gate: 10.0
    lora: 40.0
    value_head: 1.0
  bootstrap_project_checkpoint_dir: null
  bootstrap_uncond_lora_sidecar: ${oc.env:FASTWAM_UNCOND_BC_SIDECAR}
  bootstrap_uncond_lora_sidecar_sha256: ${oc.env:FASTWAM_UNCOND_BC_SIDECAR_SHA256}
  fastwam_training_guard:
    enabled: true
    action_contract_violation_outcome: fail_episode
    gate_parameter_audit_interval_updates: 10
    zero_success_patience: 3
    break_even_patience: 3
    window_size: 3
    eligible_idm_fraction_min: 0.05
    eligible_idm_fraction_max: 0.95
    gate_entropy_min: 0.35
    gate_kl_median_max: 0.05
    gate_kl_single_max: 0.1
    gate_clip_median_max: 0.6
    gate_clip_single_max: 0.8
    cost_audit:
      enabled: true
      break_even_guard_enabled: false
      counterfactual_idm_costs: [0.0, 0.0025, 0.005, 0.01, 0.015, 0.025, 0.0375, 0.05, 0.1]

algorithm:
  normalize_advantages: true
  advantage_normalization_std_floor: 0.15
  group_size: 1
  reward_coef: 1.0
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level
  update_epoch: 1
  adv_type: gae
  loss_type: fastwam_dual_ppo
  loss_agg_func: token-mean
  gamma: 0.99
  gae_lambda: 0.95
  gate_ppo:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coefficient: 0.01
    entropy_metric_source: base
    loss_weight: 1.0
  uncond_flow_ppo:
    clip_ratio_low: 0.2
    clip_ratio_high: 0.2
    entropy_coefficient: 0.0
    loss_weight: 1.0
  critic_loss:
    value_clip: 0.2
    huber_delta: 10.0
    loss_weight: 1.0
    warmup_steps: 0
  regularization:
    base_uncond_kl:
      enabled: false
      coefficient: 0.0
      log_metric: true
    collapse:
      enabled: false
      coefficient: 0.0
      tau_calls: 1.0
      scope: microbatch
      target_floor: 0.1
  fixed_branch_cost:
    enabled: true
    idm_cost: 0.015
    uncond_cost: 0.0
    fair_cost:
      enabled: true
      window_size: 5
      pi:
        # The real-gain calibration is still NOT-RUN.  Keep the updated
        # profile's intentional default rather than inventing a controller.
        enabled: false
        target_idm_fraction: 0.5
        integral_gain: 0.05
        proportional_gain: 0.6

env:
  group_name: EnvGroup
  train:
    task_id_filter: [0]
    group_size: 1
    auto_reset: false
    ignore_terminations: false
    max_steps_per_rollout_epoch: 700
    max_episode_steps: 700
    reset_wait_steps: 30
    video_cfg:
      save_video: false
      info_on_video: false
    reward_coef: ${algorithm.reward_coef}
    use_step_penalty: false
  eval:
    rollout_epoch: 1
    total_num_envs: 100
    reward_coef: ${algorithm.reward_coef}
    auto_reset: true
    ignore_terminations: true
    group_size: 1
    is_eval: true
    use_step_penalty: false

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  unnorm_key: libero_10
  pipeline_stage_num: 1
  recompute_logprobs: false
  enable_offload: false
  model:
    gate_epsilon: 0.1
    gate_temperature: 1.0
    gate:
      layer_taps:
        mode: indices
        last_n: null
        indices: [14, 15, 16, 17, 18, 19]
    uncond_lora:
      rank: 16
      alpha: 16.0
      dropout: 0.0
    fastwam:
      load_text_encoder: false
    flow_sde:
      ignore_last_transition: true
    kv_replay:
      backend: stored
      storage_dtype: bfloat16
      gate_kv_sample_budget: null
      max_bytes_per_sample: 268435456
      hot_min_free_bytes: 4294967296
      prefetch_depth: 3
      transport: host_staging

actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  enable_offload: false
  optim:
    lr: 1.0e-5
    gate_lr: 3.0e-5
    lora_lr: 1.0e-5
    value_lr: 1.0e-4
    critic_warmup_steps: 0
    total_training_steps: 3000
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    update_resolution_min_half_ulp_ratio: 1.0
    weight_decay: 0.0
    clip_grad: 1.0
    min_lr_rate: 0.1
    lr_scheduler: cosine
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    save_full_model_weights: false
    use_orig_params: true
    ignore_frozen_parameters: true
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: fp32
      reduce_dtype: fp32
      buffer_dtype: ${actor.model.precision}
      cast_root_forward_inputs: false
  model:
    gate_epsilon: 0.1
    gate_temperature: 1.0
    gate:
      layer_taps:
        mode: indices
        last_n: null
        indices: [14, 15, 16, 17, 18, 19]
    uncond_lora:
      rank: 16
      alpha: 16.0
      dropout: 0.0
    fastwam:
      load_text_encoder: false
    flow_sde:
      ignore_last_transition: true
    kv_replay:
      backend: stored
      storage_dtype: bfloat16
      gate_kv_sample_budget: null
      max_bytes_per_sample: 268435456
      hot_min_free_bytes: 4294967296
      prefetch_depth: 3
      transport: host_staging

weight_syncer:
  patch:
    transport_device: cpu

reward:
  use_reward_model: false

critic:
  use_critic_model: false
