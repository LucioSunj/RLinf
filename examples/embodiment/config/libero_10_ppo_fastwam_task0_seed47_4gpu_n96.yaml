defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/fastwam_adaptive@actor.model
  - model/fastwam_adaptive@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - profile: fastwam_fair_cost_stability_telemetry
  - online_idm_bc: enabled
  - libero_10_ppo_fastwam_task0_formal_base
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# Four-MIG host B: same scientific and systems geometry as seed 29.  The local
# /tmp path is host-local even though the repository and artifacts are shared.
cluster:
  component_placement:
    actor: "0-0"
    env: "1-3"
    rollout: "1-3"

runner:
  logger:
    experiment_name: formal_task0_seed47_4gpu_n96_20260828_v1

env:
  train:
    total_num_envs: 12
    rollout_epoch: 8
    seed: 47

actor:
  global_batch_size: 672
  seed: 47
  model:
    runtime:
      text_embedding_cache_dir: /XYFS02/HDD_POOL/nju_shklu/nju_shklu_1/When-will-inference-time-prediction-beneficial-/FastWAM/data/text_embeds_cache/libero
    kv_replay:
