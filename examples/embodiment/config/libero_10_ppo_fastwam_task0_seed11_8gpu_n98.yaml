defaults:
  - env/libero_10@env.train
  - env/libero_10@env.eval
  - model/fastwam_adaptive@actor.model
  - model/fastwam_adaptive@rollout.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - profile: fastwam_fair_cost_stability_telemetry
  - online_idm_bc: enabled
  - libero_10_ppo_fastwam_task0_formal_base
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

# RTX-4090 host: one actor plus seven rollout ranks.  One environment per
# rollout rank avoids multiplying video-diffusion activations on a 24 GiB GPU.
cluster:
  component_placement:
    actor: "0-0"
    env: "1-7"
    rollout: "1-7"

runner:
  logger:
    experiment_name: formal_task0_seed11_8gpu_n98_20260828_v1

env:
  train:
    total_num_envs: 7
    rollout_epoch: 14
    seed: 11

actor:
  global_batch_size: 686
  seed: 11
  model:
    runtime:
      text_embedding_cache_dir: /data0/FastWAM-PERF-002-storage/root-migration-20260716T0311Z/repo-runs-performance-assets/text_embeds_cache/libero
    kv_replay:
      hot_capacity_bytes_per_rollout_rank: 2147483648
      cold_capacity_bytes_per_rollout_rank: 8589934592
      nvme_capacity_bytes_per_rollout_rank: 12884901888
      nvme_path: /data0/fastwam_kv/formal_task0_seed11_8gpu_n98_20260828_v1

rollout:
  model:
    runtime:
      text_embedding_cache_dir: /data0/FastWAM-PERF-002-storage/root-migration-20260716T0311Z/repo-runs-performance-assets/text_embeds_cache/libero
    kv_replay:
      hot_capacity_bytes_per_rollout_rank: 2147483648
      cold_capacity_bytes_per_rollout_rank: 8589934592
      nvme_capacity_bytes_per_rollout_rank: 12884901888
      nvme_path: /data0/fastwam_kv/formal_task0_seed11_8gpu_n98_20260828_v1
