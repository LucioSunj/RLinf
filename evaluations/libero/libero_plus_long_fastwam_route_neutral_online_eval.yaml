defaults:
  - env/libero_10@env.eval
  - model/fastwam_route_neutral_online@rollout.model
  - override hydra/job_logging: stdout
  - _self_

# LIBERO-Plus evaluation for the current-step route-neutral Gate. The Plus
# checkout is placed first on PYTHONPATH while LIBERO_TYPE remains standard so
# the ledger can select exact perturbed reset-state identities.
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: 0

runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:FASTWAM_EVAL_OUTPUT_DIR}
    project_name: rlinf
    experiment_name: ${oc.env:FASTWAM_EVAL_RUN_ID}
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: ${oc.env:FASTWAM_PROJECT_CHECKPOINT,''}
  enable_decoupled_mode: false
  evaluation_collector:
    _target_: rlinf.runners.fastwam_libero_eval_collector.FastWAMLiberoEvalCollector
    output_dir: ${oc.env:FASTWAM_EVAL_OUTPUT_DIR}
    ledger_path: ${oc.env:FASTWAM_EVAL_LEDGER}
    run_id: ${oc.env:FASTWAM_EVAL_RUN_ID}
    fixed_idm_cost: 0.01
    noise_seed_mode: stateless_per_chunk
    contract_violation_outcome: raise
    resume: false
    policy_checkpoint_sha256: null

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 1
    total_num_envs: 1
    reward_coef: 1.0
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: true
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    ordered_reset_state_ids: [0]
    is_eval: true
    max_episode_steps: 700
    max_steps_per_rollout_epoch: 700
    reset_wait_steps: 30
    group_size: 1
    use_step_penalty: false
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  collect_prev_infos: false
  unnorm_key: libero_10
  enable_offload: false
  enable_cuda_graph: false
  enable_torch_compile: false
  pipeline_stage_num: 1
  model:
    # Contract-bound by the seed-42 training checkpoint; evaluation itself does
    # not draw the formal-training streams.
    formal_training_sampling_seed: 42
    gate_epsilon: 0.0
    eval_routing_mode: learned_threshold
    eval_idm_threshold: 0.5
    eval_random_idm_probability: null
    eval_random_lag1_autocorrelation: null
    eval_routing_seed: 0
    fastwam:
      load_text_encoder: false
    runtime:
      text_embedding_cache_dir: ${oc.env:FASTWAM_TEXT_CACHE}
      max_episode_steps: 700
      reset_wait_steps: 30
    critic:
      load_for_eval: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
