defaults:
  - env/libero_10@env.eval
  - model/fastwam_pad_frozen@rollout.model
  - pad_rv: eval_frozen
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    env,rollout: "0-6"

runner:
  task_type: embodied_eval
  logger:
    log_path: ${oc.env:FASTWAM_EVAL_OUTPUT_DIR}
    project_name: pad-rv
    experiment_name: ${oc.env:FASTWAM_EVAL_RUN_ID}
    logger_backends: [tensorboard]
  max_epochs: 1
  max_steps: -1
  only_eval: true
  val_check_interval: -1
  save_interval: -1
  resume_dir: null
  ckpt_path: ${oc.env:FASTWAM_PROJECT_CHECKPOINT}
  enable_decoupled_mode: false
  evaluation_collector:
    _target_: rlinf.models.embodiment.wam_policy.pad_rv.eval_collector.PadFrozenEvalCollector
    ledger_shard_count: 7
    output_dir: ${oc.env:FASTWAM_EVAL_OUTPUT_DIR}
    ledger_path: ${oc.env:FASTWAM_EVAL_LEDGER}
    run_id: ${oc.env:FASTWAM_EVAL_RUN_ID}
    fixed_idm_cost: 0.01
    noise_seed_mode: stateless_per_chunk
    contract_violation_outcome: fail_episode
    resume: false
    policy_checkpoint_sha256: ${oc.env:FASTWAM_PROJECT_CHECKPOINT_SHA256}

env:
  group_name: EnvGroup
  eval:
    rollout_epoch: 1
    total_num_envs: 7
    reward_coef: 1.0
    auto_reset: true
    ignore_terminations: false
    use_rel_reward: true
    use_fixed_reset_state_ids: true
    use_ordered_reset_state_ids: true
    ordered_reset_state_ids: [0, 1, 2, 3, 4, 5, 6]
    is_eval: true
    max_episode_steps: 700
    max_steps_per_rollout_epoch: 700
    group_size: 1
    use_step_penalty: false
    video_cfg:
      save_video: false
      info_on_video: false
      video_base_dir: ${runner.logger.log_path}/video/eval

rollout:
  group_name: RolloutGroup
  generation_backend: huggingface
  recompute_logprobs: false
  collect_prev_infos: false
  unnorm_key: libero_10
  enable_offload: false
  enable_cuda_graph: false
  enable_torch_compile: false
  pipeline_stage_num: 1
  model:
    formal_training_sampling_seed: 42
    eval_without_critic: true
    gate_epsilon: 0.0
    gate:
      layer_taps:
        mode: indices
        last_n: null
        indices: [14, 15, 16, 17, 18, 19]
    eval_routing_mode: learned_threshold
    eval_idm_threshold: 0.5
    eval_random_idm_probability: null
    eval_random_lag1_autocorrelation: null
    eval_routing_seed: 0
    eval_timing_cuda_synchronize: true
    decision_telemetry_enabled: false
    fastwam:
      load_text_encoder: false
    runtime:
      text_embedding_cache_dir: ${oc.env:FASTWAM_TEXT_EMBEDDING_CACHE}
    critic:
      load_for_eval: false

reward:
  use_reward_model: false

critic:
  use_critic_model: false
